name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality-gate:
    name: Static, contracts, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: socal_test
          POSTGRES_USER: socal
          POSTGRES_PASSWORD: socal_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U socal -d socal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      clamav:
        image: clamav/clamav:1.4
        ports:
          - 3310:3310
        options: >-
          --health-cmd "clamdscan --ping 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 60
      opensearch:
        image: opensearchproject/opensearch:2.19.5
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          bootstrap.memory_lock: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 60
          --ulimit memlock=-1:-1

    env:
      NODE_ENV: test
      APP_ENV: test
      DATABASE_URL: postgresql://socal:socal_test_password@localhost:5432/socal_test?schema=public
      DATABASE_INTEGRATION_URL: postgresql://socal:socal_test_password@localhost:5432/socal_test?schema=public
      REDIS_URL: redis://localhost:6379/0
      REDIS_INTEGRATION_URL: redis://localhost:6379/0
      CLAMAV_INTEGRATION_HOST: 127.0.0.1
      CLAMAV_INTEGRATION_PORT: "3310"
      OPENSEARCH_NODE: http://localhost:9200
      OPENSEARCH_INTEGRATION_URL: http://localhost:9200
      OPENSEARCH_INDEX_PREFIX: socal_ci
      SESSION_SECRET: ci-only-session-secret-at-least-32-bytes
      OTP_SECRET: ci-only-dedicated-otp-secret-at-least-32-bytes
      MFA_SECRET: ci-only-dedicated-mfa-secret-at-least-32-bytes
      PASSWORD_PEPPER: ci-only-dedicated-password-pepper-at-least-32-bytes
      CSRF_SECRET: ci-only-csrf-secret-at-least-32-bytes
      API_BASE_URL: http://localhost:4000/v1
      PUBLIC_WEB_URL: http://localhost:3000
      PUBLIC_ADMIN_URL: http://localhost:3001

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate architecture and machine-readable contracts
        run: bash scripts/check-architecture.sh

      - name: Validate dependency policy files
        run: |
          test -f pnpm-lock.yaml || { echo 'Run FND-001 and commit pnpm-lock.yaml'; exit 1; }
          grep -q '^allowBuilds:' pnpm-workspace.yaml || {
            echo 'pnpm-workspace.yaml must explicitly review dependency build scripts'
            exit 1
          }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Validate CI workflow contract
        run: pnpm ci:workflow:check

      - name: Validate ownership and pull request policy
        run: pnpm governance:check

      - name: Validate runtime configuration contract
        run: pnpm config:check

      - name: Validate container contract
        run: pnpm containers:check

      - name: Validate development seed contracts
        run: pnpm db:seed:validate

      - name: Validate canonical OpenAPI contract
        run: |
          pnpm openapi:lint
          pnpm openapi:check

      - name: Check formatting
        run: pnpm format:check

      - name: Validate Prisma schema and generate client
        run: |
          pnpm db:validate
          pnpm db:generate
          pnpm db:migrate:safety
          pnpm db:migrate:deploy
          pnpm db:upgrade:check
          pnpm db:baseline:check

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Lint workspaces
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Upload unit test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: reports/
          if-no-files-found: error
          retention-days: 14

      - name: Build deployable applications
        run: pnpm build

      - name: Check built API runtime contracts
        run: pnpm observability:check

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run foundation browser smoke
        run: pnpm test:e2e:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/e2e/
          if-no-files-found: warn
          retention-days: 14

  container-build:
    name: Build non-root application images
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build all application targets
        run: |
          for target in web-runtime admin-runtime api-runtime worker-runtime; do
            docker build --target "$target" --tag "socal-${target}:ci" .
          done

      - name: Smoke non-root runtime images and health endpoints
        run: |
          set -euo pipefail
          network="socal-runtime-smoke"
          containers="socal-web socal-admin socal-api socal-worker socal-redis"

          cleanup() {
            docker rm --force $containers >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          wait_for_health() {
            container="$1"
            url="$2"
            for attempt in $(seq 1 60); do
              if curl --fail --silent --show-error "$url"; then
                echo
                return 0
              fi
              if [ "$(docker inspect --format '{{.State.Running}}' "$container")" != "true" ]; then
                docker logs "$container"
                return 1
              fi
              sleep 1
            done
            docker logs "$container"
            return 1
          }

          for target in web-runtime admin-runtime api-runtime worker-runtime; do
            test "$(docker image inspect --format '{{.Config.User}}' "socal-${target}:ci")" = "node"
          done

          docker network create "$network"
          docker run --detach --name socal-redis --network "$network" redis:8.4-alpine
          docker run --detach --name socal-web --network "$network" \
            --publish 127.0.0.1:3000:3000 socal-web-runtime:ci
          docker run --detach --name socal-admin --network "$network" \
            --publish 127.0.0.1:3001:3001 socal-admin-runtime:ci
          docker run --detach --name socal-api --network "$network" \
            --publish 127.0.0.1:4000:4000 \
            --env APP_ENV=test \
            --env APP_NAME=socal-api-container-smoke \
            --env LOG_LEVEL=info \
            --env PUBLIC_WEB_URL=http://localhost:3000 \
            --env PUBLIC_ADMIN_URL=http://localhost:3001 \
            --env DATABASE_URL=postgresql://socal:socal@database.invalid:5432/socal?schema=public \
            --env REDIS_URL=redis://socal-redis:6379/0 \
            --env OPENSEARCH_NODE=http://opensearch.invalid:9200 \
            --env SESSION_SECRET=ci-session-secret-container-smoke-0001 \
            --env OTP_SECRET=ci-dedicated-otp-secret-container-smoke-01 \
            --env MFA_SECRET=ci-dedicated-mfa-secret-container-smoke-01 \
            --env PASSWORD_PEPPER=ci-dedicated-password-pepper-container-smoke-01 \
            --env CSRF_SECRET=ci-csrf-secret-container-smoke-000001 \
            socal-api-runtime:ci
          docker run --detach --name socal-worker --network "$network" \
            --publish 127.0.0.1:4001:4001 \
            --env APP_ENV=test \
            --env APP_NAME=socal-worker-container-smoke \
            --env LOG_LEVEL=info \
            --env DATABASE_URL=postgresql://socal:socal@database.invalid:5432/socal?schema=public \
            --env REDIS_URL=redis://socal-redis:6379/0 \
            --env OPENSEARCH_NODE=http://opensearch.invalid:9200 \
            socal-worker-runtime:ci

          wait_for_health socal-web http://127.0.0.1:3000/health/ready
          wait_for_health socal-admin http://127.0.0.1:3001/health/ready
          wait_for_health socal-api http://127.0.0.1:4000/v1/health/ready
          wait_for_health socal-worker http://127.0.0.1:4001/health/ready
