            $ref: "#/components/schemas/ModerationCase"
        page:
          $ref: "#/components/schemas/CursorPage"
        generatedAt: { type: string, format: date-time }
    LocalizedReference:
      type: object
      additionalProperties: false
      required: [id, code, nameZhHans, nameEn]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, minLength: 1, maxLength: 120 }
        nameZhHans: { type: string, minLength: 1, maxLength: 160 }
        nameEn: { type: string, minLength: 1, maxLength: 160 }
    ModerationRuleEvidence:
      type: object
      additionalProperties: false
      required: [ruleCode, ruleVersion, severity, evidenceKey]
      properties:
        ruleCode: { type: string, pattern: "^[A-Z][A-Z0-9_]{2,79}$" }
        ruleVersion: { type: integer, minimum: 1 }
        severity: { type: string, enum: [MEDIUM, HIGH] }
        evidenceKey: { type: string, pattern: "^[a-z][A-Za-z0-9_.]{1,79}$" }
    ModerationMediaEvidence:
      type: object
      additionalProperties: false
      required: [mediaId, status, rejectionCode, updatedAt]
      properties:
        mediaId: { type: string, format: uuid }
        status: { type: string, enum: [UPLOADING, SCANNING, READY, REJECTED] }
        rejectionCode:
          type: [string, "null"]
          pattern: "^[A-Z][A-Z0-9_]{2,63}$"
        updatedAt: { type: string, format: date-time }
    ModerationDuplicateCandidate:
      type: object
      additionalProperties: false
      required:
        [
          candidateListingId,
          candidateListingVersion,
          candidateType,
          candidateTitle,
          candidateStatus,
          thresholdVersion,
          mode,
          confidence,
          matchedSignals,
        ]
      properties:
        candidateListingId: { type: string, format: uuid }
        candidateListingVersion: { type: integer, minimum: 1 }
        candidateType:
          $ref: "#/components/schemas/ListingType"
        candidateTitle: { type: string, minLength: 1, maxLength: 120 }
        candidateStatus:
          $ref: "#/components/schemas/ContentStatus"
        thresholdVersion: { type: integer, minimum: 1 }
        mode: { type: string, enum: [DRY_RUN, ENFORCE] }
        confidence: { type: string, enum: [MEDIUM, HIGH] }
        matchedSignals:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: { type: string, enum: [TEXT, IMAGE, CONTACT] }
    ModerationListingSnapshot:
      type: object
      additionalProperties: false
      required:
        [
          listingId,
          listingVersion,
          type,
          locale,
          title,
          summary,
          body,
          price,
          attributes,
          contactMode,
          locationPrecision,
          mediaIds,
          category,
          region,
          formSchemaVersion,
          defaultLifetimeDays,
          sensitiveFieldsRedacted,
          previous,
          revision,
          capturedAt,
        ]
      properties:
        listingId: { type: string, format: uuid }
        listingVersion: { type: integer, minimum: 1 }
        type:
          $ref: "#/components/schemas/ListingType"
        locale: { type: string, enum: [zh-Hans, en-US] }
        title: { type: string, minLength: 1, maxLength: 120 }
        summary: { type: [string, "null"], maxLength: 240 }
        body: { type: string, minLength: 1, maxLength: 10000 }
        price:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        attributes:
          type: object
          additionalProperties: true
        contactMode: { type: string, enum: [IN_APP, PHONE_REVEAL, EMAIL_REVEAL] }
        locationPrecision: { type: string, enum: [CITY, NEIGHBORHOOD, APPROXIMATE, EXACT] }
        mediaIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, format: uuid }
        category:
          $ref: "#/components/schemas/LocalizedReference"
        region:
          $ref: "#/components/schemas/LocalizedReference"
        formSchemaVersion: { type: integer, minimum: 1 }
        defaultLifetimeDays: { type: integer, minimum: 1, maximum: 365 }
        sensitiveFieldsRedacted: { type: boolean, const: true }
        previous:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        revision:
          oneOf:
            - type: object
              additionalProperties: false
              required: [id, classification, reasonCodes, originalPublishedAt, originalExpiresAt]
              properties:
                id: { type: string, format: uuid }
                classification:
                  $ref: "#/components/schemas/ListingRevisionClassification"
                reasonCodes:
                  type: array
                  minItems: 1
                  maxItems: 20
                  uniqueItems: true
                  items:
                    $ref: "#/components/schemas/ListingRevisionReasonCode"
                originalPublishedAt: { type: [string, "null"], format: date-time }
                originalExpiresAt: { type: [string, "null"], format: date-time }
            - type: "null"
        capturedAt: { type: string, format: date-time }
    ModerationDiffEntry:
      type: object
      additionalProperties: false
      required: [field, kind, before, after]
      properties:
        field: { type: string, pattern: "^[a-z][A-Za-z0-9_.]{0,79}$" }
        kind: { type: string, enum: [ADDED, CHANGED, REMOVED] }
        before: {}
        after: {}
    ModerationReasonOption:
      type: object
      additionalProperties: false
      required: [code, actions]
      properties:
        code:
          {
            type: string,
            enum:
              [
                CONTENT_POLICY_COMPLIANT,
                DUPLICATE_CONTENT,
                NEEDS_CLARIFICATION,
                PROHIBITED_CONTENT,
                EXTERNAL_PAYMENT_RISK,
                ESCALATE_SENIOR_REVIEW,
              ],
          }
        actions:
          type: array
          uniqueItems: true
          items: { type: string, enum: [APPROVE, REQUEST_CHANGES, REJECT, ESCALATE] }
    ModerationCaseDetailResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            [
              case,
              snapshot,
              diff,
              rules,
              media,
              duplicateCandidates,
              publisherHistory,
              availableActions,
              reasonOptions,
              generatedAt,
              source,
            ]
          properties:
            case:
              $ref: "#/components/schemas/ModerationCase"
            snapshot:
              $ref: "#/components/schemas/ModerationListingSnapshot"
            diff:
              type: array
              maxItems: 50
              items:
                $ref: "#/components/schemas/ModerationDiffEntry"
            rules:
              type: array
              maxItems: 50
              items:
                $ref: "#/components/schemas/ModerationRuleEvidence"
            media:
              type: array
              maxItems: 20
              items:
                $ref: "#/components/schemas/ModerationMediaEvidence"
            duplicateCandidates:
              type: array
              maxItems: 10
              items:
                $ref: "#/components/schemas/ModerationDuplicateCandidate"
            publisherHistory:
              type: object
              additionalProperties: false
              required:
                [accountAgeDays, submittedCount, publishedCount, rejectedCount, suspendedCount]
              properties:
                accountAgeDays: { type: integer, minimum: 0 }
                submittedCount: { type: integer, minimum: 0 }
                publishedCount: { type: integer, minimum: 0 }
                rejectedCount: { type: integer, minimum: 0 }
                suspendedCount: { type: integer, minimum: 0 }
            availableActions:
              type: array
              uniqueItems: true
              items: { type: string, enum: [APPROVE, REQUEST_CHANGES, REJECT, ESCALATE] }
            reasonOptions:
              type: array
              items:
                $ref: "#/components/schemas/ModerationReasonOption"
            generatedAt: { type: string, format: date-time }
            source: { type: string, const: POSTGRESQL }
    ModerationActionRequest:
      type: object
      additionalProperties: false
      required: [action, reasonCode]
      properties:
        action: { type: string, enum: [APPROVE, REQUEST_CHANGES, REJECT, ESCALATE] }
        reasonCode:
          {
            type: string,
            enum:
              [
