openapi: 3.1.0
info:
  title: 南加生活网 API
  version: 0.1.0
  description: |
    面向网站、管理后台及未来移动端的 REST API 合同。
    所有写操作必须支持幂等性、审计和统一 Problem Details 错误格式。
servers:
  - url: http://localhost:4000/v1
    description: Local
  - url: https://api.staging.example.com/v1
    description: Staging placeholder
security:
  - sessionCookie: []
tags:
  - name: Health
    description: Process liveness and dependency readiness
  - name: Auth
    description: Authentication challenges and sessions
  - name: Organizations
    description: Authenticated organization ownership and member-scoped management
  - name: Taxonomy
    description: Regions, categories, and dynamic form definitions
  - name: Search
    description: Public search and query suggestions
  - name: Listings
    description: Classified listing lifecycle and public views
  - name: Media
    description: Quarantined media upload and processing
  - name: Engagement
    description: Favorites, reviews, and other trust interactions
  - name: Messaging
    description: Private conversations and messages
  - name: Businesses
    description: Business directory resources
  - name: Providers
    description: Service provider directory resources
  - name: Reports
    description: User reports and abuse intake
  - name: Billing
    description: Orders, payment sessions, and provider webhooks
  - name: Ads
    description: Advertising placements and campaigns
  - name: Admin
    description: Authorized operator and moderation workflows
paths:
  /health/live:
    get:
      tags: [Health]
      security: []
      summary: Get process liveness
      operationId: getLiveness
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      tags: [Health]
      security: []
      summary: Get dependency readiness
      operationId: getReadiness
      responses:
        "200":
          description: Required dependencies are reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/otp/request:
    post:
      tags: [Auth]
      security: []
      summary: Request an OTP challenge
      description: Always returns the same accepted projection for valid input; account existence is never disclosed.
      operationId: requestOtp
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "202":
          description: OTP accepted for delivery; response never reveals account existence
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpAcceptedResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/otp/verify:
    post:
      tags: [Auth]
      security: []
      summary: Verify an OTP challenge
      description: Invalid, expired, consumed, and unknown challenges share one generic response.
      operationId: verifyOtp
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyRequest"
      responses:
        "200":
          description: Authenticated session established
          headers:
            Set-Cookie:
              schema:
                type: string
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/session:
    get:
      tags: [Auth]
      summary: Get the current session
      description: Resolves the opaque host-only session cookie; never returns the bearer token or contact identifiers.
      operationId: getSession
      responses:
        "200":
          description: Current session
          headers:
            Cache-Control:
              description: Session responses are never stored by shared or browser caches.
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Auth]
      summary: Revoke the current session
      description: Idempotently revokes the presented session and expires the host-only cookie.
      operationId: logout
      responses:
        "204":
          description: Session revoked
          headers:
            Set-Cookie:
              description: Clears the Secure, HttpOnly, SameSite=Lax cookie scoped to /v1.
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
  /me:
    get:
      tags: [Auth]
      summary: Get the current user's profile
      description: Returns only the authenticated user's profile projection; contact identifiers and internal trust fields are excluded.
      operationId: getMyProfile
      responses:
        "200":
          description: Current profile
          headers:
            ETag:
              description: Strong profile version tag required by profile updates.
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Auth]
      summary: Update the current user's profile
      description: Updates a whitelisted profile projection using optimistic concurrency; contact and account-status fields cannot be changed here.
      operationId: updateMyProfile
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/UpdateMyProfileRequest"
      responses:
        "200":
          description: Updated profile
          headers:
            ETag:
              description: New strong profile version tag.
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfileResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /me/sessions:
    get:
      tags: [Auth]
      summary: List the current user's active session devices
      description: Returns bounded session metadata without bearer tokens, token hashes, IP hashes, or contact identifiers.
      operationId: listMySessions
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Cursor-paginated active sessions
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDeviceCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Auth]
      summary: Revoke all of the current user's sessions
      description: Atomically revokes every active session for the authenticated user and expires the presented cookie.
      operationId: logoutAllSessions
      responses:
        "204":
          description: All sessions revoked
          headers:
            Set-Cookie:
              description: Clears the Secure, HttpOnly, SameSite=Lax cookie scoped to /v1.
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/sessions/{sessionId}:
    delete:
      tags: [Auth]
      summary: Revoke one of the current user's session devices
      description: Idempotently revokes only a session owned by the authenticated user; foreign and unknown identifiers share the same response.
      operationId: revokeMySession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: Session no longer active
          headers:
            Set-Cookie:
              description: Present only when the revoked session is the current session.
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /organizations:
    post:
      tags: [Organizations]
      summary: Create an organization owned by the current user
      description: Atomically creates the organization and its initial OWNER membership. The requested slug is the stable retry handle; an exact owner retry returns the original resource.
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organization and initial OWNER membership created, or the exact owner retry returned
          headers:
            Location:
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /organizations/{organizationId}:
    get:
      tags: [Organizations]
      summary: Get an organization visible to the current member
      description: Uses a membership-scoped repository query so unknown and cross-organization identifiers share one 404 response.
      operationId: getMyOrganization
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Member-safe organization projection
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /organizations/{organizationId}/members:
    get:
      tags: [Organizations]
      summary: List organization members for OWNER or ADMIN
      description: Returns only display identity, role, and join time; contact identifiers and account risk fields are excluded.
      operationId: listOrganizationMembers
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Cursor-paginated member projection
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMemberCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /regions:
    get:
      tags: [Taxonomy]
      security: []
      summary: List supported regions
      operationId: listRegions
      parameters:
        - name: parentCode
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/RegionType"
        - name: activeOnly
          in: query
          description: Public taxonomy is active-only; false is rejected.
          schema: { type: boolean, const: true, default: true }
        - name: q
          in: query
          description: Bounded name, code, slug, or normalized alias query
          schema: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "200":
          description: Region tree or children
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Region"
        "400":
          $ref: "#/components/responses/BadRequest"
  /categories:
    get:
      tags: [Taxonomy]
      security: []
      summary: List supported categories
      operationId: listCategories
      parameters:
        - name: vertical
          in: query
          schema:
            $ref: "#/components/schemas/ListingType"
        - name: parentId
          in: query
          schema: { type: string, format: uuid }
        - name: activeOnly
          in: query
          description: Public taxonomy is active-only; false is rejected.
          schema: { type: boolean, const: true, default: true }
        - name: q
          in: query
          description: Bounded bilingual name, slug, or normalized alias query
          schema: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "200":
          description: Category tree
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
  /categories/{categoryId}/form-schema:
    get:
      tags: [Taxonomy]
      security: []
      summary: Get a category form schema
      operationId: getCategoryFormSchema
      parameters:
        - $ref: "#/components/parameters/CategoryId"
        - name: version
          in: query
          description: Published historical version; omit for the category's current published version.
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Versioned dynamic form definition
          headers:
            ETag:
              description: Strong content hash for the immutable published version.
              schema: { type: string }
            Cache-Control:
              description: Public cache policy for an immutable or current schema response.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryFormSchema"
        "404":
          $ref: "#/components/responses/NotFound"
  /search:
    get:
      tags: [Search]
      security: []
      summary: Search public content
      operationId: searchContent
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/ListingType"
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: regionCode
          in: query
          schema: { type: string }
        - name: latitude
          in: query
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: longitude
          in: query
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: radiusMiles
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: minPrice
          in: query
          schema: { type: number, minimum: 0 }
        - name: maxPrice
          in: query
          schema: { type: number, minimum: 0 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [RELEVANCE, NEWEST, PRICE_ASC, PRICE_DESC, DISTANCE]
            default: RELEVANCE
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Search results and facets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
  /search/suggestions:
    get:
      tags: [Search]
      security: []
      summary: Get search suggestions
      operationId: getSearchSuggestions
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 50 }
        - name: regionCode
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Query, category, city, and entity suggestions
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    maxItems: 10
                    items:
                      $ref: "#/components/schemas/SearchSuggestion"
  /listings:
    get:
      tags: [Listings]
      security: []
      summary: List visible listings
      operationId: listListings
      parameters:
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/ListingType"
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: regionCode
          in: query
          schema: { type: string }
        - name: status
          in: query
          description: Non-public status filters require ownership or operator permissions
          schema:
            $ref: "#/components/schemas/ContentStatus"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Cursor-paginated listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Listings]
      summary: Create a draft listing
      operationId: createListing
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListingRequest"
      responses:
        "201":
          description: Draft listing created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Listing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /listings/{listingId}:
    get:
      tags: [Listings]
      security: []
      summary: Get a visible listing
      operationId: getListing
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "200":
          description: Listing detail
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Listing"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Listings]
      summary: Update an owned listing
      operationId: updateListing
      parameters:
        - $ref: "#/components/parameters/ListingId"
        - name: If-Match
          in: header
          required: true
          description: Optimistic concurrency version, for example W/"12"
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/UpdateListingRequest"
      responses:
        "200":
          description: Updated listing
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Listing"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Listings]
      summary: Soft-delete an owned listing
      operationId: deleteListing
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "204":
          description: Listing soft-deleted and removed from search
  /listings/{listingId}/submit:
    post:
      tags: [Listings]
      summary: Submit a listing for moderation
      operationId: submitListing
      parameters:
        - $ref: "#/components/parameters/ListingId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Listing entered automated/manual review workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowTransitionResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /listings/{listingId}/renew:
    post:
      tags: [Listings]
      summary: Renew an eligible listing
      operationId: renewListing
      parameters:
        - $ref: "#/components/parameters/ListingId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Listing expiration extended according to policy/plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowTransitionResponse"
        "402":
          description: Paid renewal required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /media/uploads:
    post:
      tags: [Media]
      summary: Create a media upload intent
      description: |
        Reserves quota and returns a five-minute direct-upload target in private quarantine.
        The caller must send the declared content type, length and SHA-256 checksum headers exactly.
        Verification documents remain disabled until the separate restricted-storage workflow ships.
      operationId: createMediaUpload
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadRequest"
      responses:
        "201":
          description: Presigned upload created
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /media/{mediaId}/complete:
    post:
      tags: [Media]
      summary: Complete a media upload
      operationId: completeMediaUpload
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "202":
          description: Scan and derivative generation queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
  /favorites:
    get:
      tags: [Engagement]
      summary: List the current user's favorites
      operationId: listFavorites
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: User favorites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingCollection"
  /favorites/{listingId}:
    put:
      tags: [Engagement]
      summary: Add a listing to favorites
      operationId: addFavorite
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "204":
          description: Favorite is present; idempotent
    delete:
      tags: [Engagement]
      summary: Remove a listing from favorites
      operationId: removeFavorite
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "204":
          description: Favorite removed; idempotent
  /conversations:
    get:
      tags: [Messaging]
      summary: List the current user's conversations
      operationId: listConversations
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: User conversations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationCollection"
    post:
      tags: [Messaging]
      summary: Create or reuse a conversation
      operationId: createConversation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "201":
          description: Existing or newly created conversation
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Conversation"
  /conversations/{conversationId}/messages:
    get:
      tags: [Messaging]
      summary: List conversation messages
      operationId: listMessages
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Conversation messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageCollection"
    post:
      tags: [Messaging]
      summary: Send a conversation message
      operationId: sendMessage
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "201":
          description: Message accepted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Message"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /businesses:
    get:
      tags: [Businesses]
      security: []
      summary: List public businesses
      operationId: listBusinesses
      parameters:
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: regionCode
          in: query
          schema: { type: string }
        - name: verifiedOnly
          in: query
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Business directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessCollection"
  /businesses/{businessId}:
    get:
      tags: [Businesses]
      security: []
      summary: Get a public business
      operationId: getBusiness
      parameters:
        - name: businessId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Business profile
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Business"
        "404":
          $ref: "#/components/responses/NotFound"
  /providers:
    get:
      tags: [Providers]
      security: []
      summary: List public service providers
      operationId: listProviders
      parameters:
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: regionCode
          in: query
          schema: { type: string }
        - name: verifiedOnly
          in: query
          schema: { type: boolean, default: true }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Service provider directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderCollection"
  /reviews:
    post:
      tags: [Engagement]
      summary: Create a review
      operationId: createReview
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewRequest"
      responses:
        "201":
          description: Review submitted for moderation
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Review"
        "409":
          $ref: "#/components/responses/Conflict"
  /reports:
    post:
      tags: [Reports]
      summary: Submit a user report
      operationId: createReport
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportRequest"
      responses:
        "202":
          description: Report accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
  /billing/checkout-sessions:
    post:
      tags: [Billing]
      summary: Create a hosted checkout session
      operationId: createCheckoutSession
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckoutRequest"
      responses:
        "201":
          description: Hosted checkout session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSessionResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /billing/webhooks/stripe:
    post:
      tags: [Billing]
      security: []
      summary: Receive a signed Stripe webhook
      operationId: receiveStripeWebhook
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Event accepted or already processed
        "400":
          $ref: "#/components/responses/BadRequest"
  /ads/placements:
    get:
      tags: [Ads]
      security: []
      summary: List public ad placements
      operationId: listAdPlacements
      responses:
        "200":
          description: Public placement inventory metadata
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdPlacement"
  /ads/campaigns:
    post:
      tags: [Ads]
      summary: Create a draft ad campaign
      operationId: createAdCampaign
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCampaignRequest"
      responses:
        "201":
          description: Draft campaign created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AdCampaign"
  /admin/moderation/cases:
    get:
      tags: [Admin]
      summary: List moderation cases
      operationId: listModerationCases
      parameters:
        - name: queue
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, ASSIGNED, RESOLVED, APPEALED, CLOSED] }
        - name: minPriority
          in: query
          schema: { type: integer, minimum: 0, maximum: 100 }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Operator moderation queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationCaseCollection"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/moderation/cases/{caseId}/actions:
    post:
      tags: [Admin]
      summary: Apply a moderation action
      operationId: actOnModerationCase
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationActionRequest"
      responses:
        "200":
          description: Action committed with audit log and outbox event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowTransitionResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: socal_session
      description: Opaque 256-bit bearer token; host-only, Secure, HttpOnly, SameSite=Lax, Path=/v1. Only its HMAC is persisted.
  parameters:
    ListingId:
      name: listingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: Opaque client-generated installation identifier used only through a keyed hash for abuse controls.
      schema: { type: string, minLength: 16, maxLength: 128, pattern: "^[A-Za-z0-9._:-]+$" }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag returned with the current resource version.
      schema: { type: string, maxLength: 80 }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    PayloadTooLarge:
      description: Request body or declared upload exceeds the endpoint limit
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Unauthorized:
      description: Authentication required
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Forbidden:
      description: Permission denied
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: Resource not found or not visible
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Conflict:
      description: State or optimistic concurrency conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    UnprocessableEntity:
      description: Business validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ServiceUnavailable:
      description: Required dependency or feature is unavailable
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    HealthResponse:
      type: object
      required: [status, service, timestamp]
      examples:
        - status: ok
          service: api
          timestamp: "2026-07-24T12:00:00.000Z"
      properties:
        status: { type: string, const: ok }
        service: { type: string }
        timestamp: { type: string, format: date-time }
    ReadinessResponse:
      type: object
      required: [status, checks]
      examples:
        - status: ok
          checks:
            process: ok
      properties:
        status: { type: string, enum: [ok, degraded] }
        checks:
          type: object
          additionalProperties: { type: string }
    AcceptedResponse:
      type: object
      required: [accepted, requestId]
      properties:
        accepted: { type: boolean, const: true }
        requestId: { type: string }
    ProblemDetails:
      type: object
      required: [type, title, status, detail, instance, requestId]
      examples:
        - type: https://api.socal.local/problems/validation
          title: Bad Request
          status: 400
          detail: Request validation failed
          instance: /v1/listings
          requestId: 00000000-0000-4000-8000-000000000001
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        requestId: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    OtpRequest:
      type: object
      required: [channel, destination, purpose]
      additionalProperties: false
      properties:
        channel: { type: string, enum: [SMS, EMAIL] }
        destination: { type: string, maxLength: 320 }
        purpose: { type: string, enum: [SIGN_IN, VERIFY_CONTACT, SENSITIVE_ACTION] }
        locale: { type: string, enum: [zh-Hans, en-US], default: zh-Hans }
    OtpVerifyRequest:
      type: object
      required: [challengeId, code]
      additionalProperties: false
      properties:
        challengeId: { type: string, format: uuid }
        code: { type: string, pattern: '^\\d{6}$' }
    OtpAcceptedResponse:
      type: object
      required: [accepted, requestId, challengeId, expiresAt]
      additionalProperties: false
      properties:
        accepted: { type: boolean, const: true }
        requestId: { type: string }
        challengeId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
    SessionResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Session"
    Session:
      type: object
      required: [user, expiresAt, permissions]
      properties:
        user:
          $ref: "#/components/schemas/UserSummary"
        expiresAt: { type: string, format: date-time }
        permissions:
          type: array
          items: { type: string }
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationSummary"
    MyProfileResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/MyProfile"
    MyProfile:
      type: object
      required: [id, displayName, avatarUrl, bio, preferredLocale, homeRegionId, version, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        avatarUrl: { type: [string, "null"], format: uri }
        bio: { type: [string, "null"], maxLength: 500 }
        preferredLocale: { type: string, enum: [zh-Hans, en-US] }
        homeRegionId: { type: [string, "null"], format: uuid }
        version: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
    UpdateMyProfileRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        bio: { type: [string, "null"], maxLength: 500 }
        preferredLocale: { type: string, enum: [zh-Hans, en-US] }
        homeRegionId: { type: [string, "null"], format: uuid }
    SessionDeviceCollection:
      type: object
      required: [data, pageInfo]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SessionDevice"
        pageInfo:
          $ref: "#/components/schemas/CursorPage"
    SessionDevice:
      type: object
      required: [id, current, userAgent, createdAt, lastSeenAt, expiresAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        current: { type: boolean }
        userAgent: { type: [string, "null"], maxLength: 512 }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    UserSummary:
      type: object
      required: [id, displayName, locale, status]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        avatarUrl: { type: [string, "null"], format: uri }
        locale: { type: string, enum: [zh-Hans, en-US] }
        status: { type: string, enum: [ACTIVE, LIMITED, SUSPENDED] }
        verificationBadges:
          type: array
          items: { type: string }
    OrganizationSummary:
      type: object
      required: [id, type, displayName, slug, role]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        type:
          $ref: "#/components/schemas/OrganizationType"
        displayName: { type: string }
        slug: { type: string }
        role:
          $ref: "#/components/schemas/MembershipRole"
    OrganizationType:
      type: string
      enum: [MERCHANT, SERVICE_PROVIDER, SUPPLIER, MEDIA, INTERNAL]
    MembershipRole:
      type: string
      enum: [OWNER, ADMIN, EDITOR, BILLING, ANALYST]
    CreateOrganizationRequest:
      type: object
      required: [type, displayName, slug]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [MERCHANT, SERVICE_PROVIDER, SUPPLIER, MEDIA]
        displayName: { type: string, minLength: 1, maxLength: 120 }
        legalName: { type: [string, "null"], minLength: 1, maxLength: 200 }
        slug:
          type: string
          minLength: 3
          maxLength: 80
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    Organization:
      type: object
      required:
        [
          id,
          type,
          displayName,
          legalName,
          slug,
          status,
          verificationStatus,
          role,
          createdAt,
          updatedAt,
        ]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        type:
          $ref: "#/components/schemas/OrganizationType"
        displayName: { type: string, minLength: 1, maxLength: 120 }
        legalName: { type: [string, "null"], maxLength: 200 }
        slug: { type: string, minLength: 3, maxLength: 140 }
        status: { type: string, enum: [ACTIVE, LIMITED, SUSPENDED] }
        verificationStatus:
          type: string
          enum: [UNVERIFIED, PENDING, VERIFIED, REJECTED, EXPIRED]
        role:
          $ref: "#/components/schemas/MembershipRole"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrganizationResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/Organization"
    OrganizationMember:
      type: object
      required: [userId, displayName, avatarUrl, role, joinedAt]
      additionalProperties: false
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        avatarUrl: { type: [string, "null"], format: uri }
        role:
          $ref: "#/components/schemas/MembershipRole"
        joinedAt: { type: string, format: date-time }
    OrganizationMemberCollection:
      type: object
      required: [data, pageInfo]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationMember"
        pageInfo:
          $ref: "#/components/schemas/CursorPage"
    RegionType:
      type: string
      enum: [COUNTRY, STATE, COUNTY, CITY, NEIGHBORHOOD, ZIP_CODE, REGION_GROUP]
    TaxonomyAlias:
      type: object
      required: [locale, value]
      additionalProperties: false
      properties:
        locale: { type: string, enum: [zh-Hans, en-US, und] }
        value: { type: string, minLength: 1, maxLength: 120 }
    Region:
      type: object
      required:
        [id, parentId, code, type, slug, name, timezone, centroid, active, aliases, children]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        parentId: { type: [string, "null"], format: uuid }
        code: { type: string }
        type:
          $ref: "#/components/schemas/RegionType"
        slug: { type: string }
        name:
          type: object
          required: [zh-Hans, en-US]
          properties:
            zh-Hans: { type: string }
            en-US: { type: string }
        timezone: { type: string }
        centroid:
          oneOf:
            - $ref: "#/components/schemas/GeoPoint"
            - type: "null"
        active: { type: boolean }
        aliases:
          type: array
          items:
            $ref: "#/components/schemas/TaxonomyAlias"
        children:
          type: array
          items:
            $ref: "#/components/schemas/Region"
    ListingType:
      type: string
      enum: [JOB, RENTAL, TRANSFER, SECONDHAND, SERVICE]
    ContentStatus:
      type: string
      enum: [DRAFT, SUBMITTED, PUBLISHED, EXPIRED, ARCHIVED, SUSPENDED, DELETED]
    ModerationStatus:
      type: string
      enum: [NOT_REVIEWED, AUTO_APPROVED, PENDING_REVIEW, APPROVED, REJECTED, ESCALATED]
    Category:
      type: object
      required:
        [id, parentId, vertical, slug, name, iconKey, formSchemaVersion, active, aliases, children]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        parentId: { type: [string, "null"], format: uuid }
        vertical:
          oneOf:
            - $ref: "#/components/schemas/ListingType"
            - type: "null"
        slug: { type: string }
        name:
          type: object
          required: [zh-Hans, en-US]
          properties:
            zh-Hans: { type: string }
            en-US: { type: string }
        iconKey: { type: [string, "null"] }
        formSchemaVersion: { type: integer, minimum: 1 }
        active: { type: boolean }
        aliases:
          type: array
          items:
            $ref: "#/components/schemas/TaxonomyAlias"
        children:
          type: array
          items:
            $ref: "#/components/schemas/Category"
    CategoryFormSchema:
      type: object
      required: [categoryId, version, fields]
      additionalProperties: false
      properties:
        categoryId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        fields:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/FormField"
        publicationPolicy:
          $ref: "#/components/schemas/FormPublicationPolicy"
    LocalizedText:
      type: object
      required: [zh-Hans, en-US]
      additionalProperties: false
      properties:
        zh-Hans: { type: string, minLength: 1, maxLength: 120 }
        en-US: { type: string, minLength: 1, maxLength: 120 }
    FormOption:
      type: object
      required: [value, label]
      additionalProperties: false
      properties:
        value: { type: string, minLength: 1, maxLength: 80, pattern: "^[a-z0-9][a-zA-Z0-9_-]*$" }
        label:
          $ref: "#/components/schemas/LocalizedText"
    FormFieldValidation:
      type: object
      additionalProperties: false
      properties:
        min: { type: number }
        max: { type: number }
        minLength: { type: integer, minimum: 0, maximum: 10000 }
        maxLength: { type: integer, minimum: 1, maximum: 10000 }
        pattern: { type: string, minLength: 1, maxLength: 256 }
    FormPublicationPolicy:
      type: object
      additionalProperties: false
      properties:
        defaultLifetimeDays: { type: integer, minimum: 1, maximum: 365 }
        manualReviewRequired: { type: boolean }
        phoneVerificationRequired: { type: boolean }
        maxMedia: { type: integer, minimum: 0, maximum: 20 }
        allowExactAddress: { type: boolean }
    FormField:
      type: object
      required: [key, type, label, required, filterable, searchable, visibility, sortOrder]
      additionalProperties: false
      properties:
        key: { type: string, minLength: 2, maxLength: 80, pattern: "^[a-z][a-zA-Z0-9_]{1,79}$" }
        type:
          {
            type: string,
            enum:
              [
                TEXT,
                TEXTAREA,
                NUMBER,
                MONEY,
                SELECT,
                MULTISELECT,
                BOOLEAN,
                DATE,
                LOCATION,
                PHONE,
                EMAIL,
              ],
          }
        label:
          $ref: "#/components/schemas/LocalizedText"
        helpText:
          $ref: "#/components/schemas/LocalizedText"
        required: { type: boolean }
        filterable: { type: boolean }
        searchable: { type: boolean }
        options:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/FormOption"
        validation:
          $ref: "#/components/schemas/FormFieldValidation"
        visibility:
          type: string
          enum: [PUBLIC, OWNER_ONLY, MODERATOR_ONLY]
          default: PUBLIC
        sortOrder: { type: integer, minimum: 0 }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: '^\\d+(\\.\\d{1,2})?$' }
        currency: { type: string, const: USD }
        unit:
          {
            type: [string, "null"],
            enum: [FIXED, HOURLY, DAILY, WEEKLY, MONTHLY, YEARLY, SQFT, NEGOTIABLE, FREE, null],
          }
    GeoPoint:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    Listing:
      type: object
      required:
        [
          id,
          type,
          status,
          moderationStatus,
          title,
          slug,
          body,
          region,
          category,
          owner,
          attributes,
          createdAt,
          updatedAt,
          version,
        ]
      properties:
        id: { type: string, format: uuid }
        type:
          $ref: "#/components/schemas/ListingType"
        status:
          $ref: "#/components/schemas/ContentStatus"
        moderationStatus:
          $ref: "#/components/schemas/ModerationStatus"
