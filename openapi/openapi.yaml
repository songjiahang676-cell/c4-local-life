            actionId: { type: string, format: uuid }
            action: { type: string, enum: [APPROVE, REQUEST_CHANGES, REJECT, ESCALATE] }
            reasonCode:
              {
                type: string,
                enum:
                  [
                    CONTENT_POLICY_COMPLIANT,
                    DUPLICATE_CONTENT,
                    NEEDS_CLARIFICATION,
                    PROHIBITED_CONTENT,
                    EXTERNAL_PAYMENT_RISK,
