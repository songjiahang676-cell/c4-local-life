              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingSubmissionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /listings/{listingId}/archive:
    put:
      tags: [Listings]
      summary: Archive an owned published listing
      description: |
        Idempotent resource-state operation. A current strong Listing ETag is required so a
        concurrent moderation, expiry or owner action cannot be silently overwritten.
      operationId: archiveListing
      parameters:
        - $ref: "#/components/parameters/ListingId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Listing archived and removed from public reads
          headers:
            ETag:
              schema: { type: string, pattern: '^"listing-v[1-9]\d{0,9}"$' }
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingOwnerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /listings/{listingId}/renew:
