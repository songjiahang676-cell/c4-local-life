        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /admin/mfa/enrollment:
    post:
      tags: [Admin]
      summary: Begin TOTP enrollment for the current operator
      description: |
        Replaces only an unexpired or expired pending enrollment. Active and administratively
        disabled credentials cannot be overwritten. The TOTP secret is returned exactly for this
        enrollment response and is never logged.
      operationId: beginAdminMfaEnrollment
      responses:
        "201":
          description: Pending TOTP enrollment created
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMfaEnrollmentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/mfa/enrollment/verify:
    post:
      tags: [Admin]
      summary: Verify and activate a pending TOTP enrollment
      description: |
        Activates the credential only after a valid, unreplayed TOTP. Recovery codes are returned
        once and only their domain-separated hashes are stored.
      operationId: verifyAdminMfaEnrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMfaEnrollmentVerifyRequest"
