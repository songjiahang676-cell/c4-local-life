                  ],
              }
            previousCaseStatus: { type: string, enum: [OPEN, ASSIGNED, RESOLVED, APPEALED, CLOSED] }
            currentCaseStatus: { type: string, enum: [OPEN, ASSIGNED, RESOLVED, APPEALED, CLOSED] }
            previousContentStatus:
