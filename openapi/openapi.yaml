        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Listing expiration extended according to policy/plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowTransitionResponse"
        "402":
          description: Paid renewal required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /media/uploads:
    post:
      tags: [Media]
      summary: Create a media upload intent
      description: |
        Reserves quota and returns a five-minute direct-upload target in private quarantine.
        The caller must send the declared content type, length and SHA-256 checksum headers exactly.
        Verification documents remain disabled until the separate restricted-storage workflow ships.
      operationId: createMediaUpload
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadRequest"
      responses:
        "201":
          description: Presigned upload created
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /media/{mediaId}:
    get:
      tags: [Media]
      summary: Get owner-scoped media processing status
      description: |
        Returns only bounded lifecycle state for an asset owned by the current user. Object keys,
        storage buckets, hashes, original URLs and provider errors are never exposed. Unknown and
        foreign identifiers share the same 404 response.
      operationId: getMediaStatus
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: Current private media lifecycle state
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaStatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /media/{mediaId}/complete:
    post:
      tags: [Media]
      summary: Complete a media upload
      description: |
        Verifies the private quarantine object's declared length, content type and SHA-256 metadata,
        then atomically moves the owner-scoped asset to SCANNING and writes the processing Outbox event.
        Replays are resource-idempotent; READY is never inferred from this response.
      operationId: completeMediaUpload
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "202":
          description: Scan and derivative generation queued
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaProcessingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
