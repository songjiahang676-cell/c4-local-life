openapi: 3.1.0
info:
  title: 南加生活网 API
  version: 0.1.0
  description: |
    面向网站、管理后台及未来移动端的 REST API 合同。
    所有写操作必须支持幂等性、审计和统一 Problem Details 错误格式。
servers:
  - url: http://localhost:4000/v1
    description: Local
  - url: https://api.staging.example.com/v1
    description: Staging placeholder
security:
  - sessionCookie: []
tags:
  - name: Health
    description: Process liveness and dependency readiness
  - name: Auth
    description: Authentication challenges and sessions
  - name: Organizations
    description: Authenticated organization ownership and member-scoped management
  - name: Taxonomy
    description: Regions, categories, and dynamic form definitions
  - name: Search
    description: Public search and query suggestions
  - name: Homepage
    description: Public modular homepage projection
  - name: Listings
    description: Classified listing lifecycle and public views
  - name: Media
    description: Quarantined media upload and processing
  - name: Engagement
    description: Favorites, reviews, and other trust interactions
  - name: Messaging
    description: Private conversations and messages
  - name: Notifications
    description: Private in-app notifications and read state
  - name: Businesses
    description: Business directory resources
  - name: Providers
    description: Service provider directory resources
  - name: Reports
    description: User reports and abuse intake
  - name: Billing
    description: Orders, payment sessions, and provider webhooks
  - name: Ads
    description: Advertising placements and campaigns
  - name: Admin
    description: Authorized operator and moderation workflows
paths:
  /health/live:
    get:
      tags: [Health]
      security: []
      summary: Get process liveness
      operationId: getLiveness
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      tags: [Health]
      security: []
      summary: Get dependency readiness
      operationId: getReadiness
      responses:
        "200":
          description: Required dependencies are reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/otp/request:
    post:
      tags: [Auth]
      security: []
      summary: Request an OTP challenge
      description: Always returns the same accepted projection for valid input; account existence is never disclosed.
      operationId: requestOtp
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "202":
          description: OTP accepted for delivery; response never reveals account existence
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpAcceptedResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/otp/verify:
    post:
      tags: [Auth]
      security: []
      summary: Verify an OTP challenge
      description: Invalid, expired, consumed, and unknown challenges share one generic response.
      operationId: verifyOtp
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyRequest"
      responses:
        "200":
          description: Authenticated session established
          headers:
            Set-Cookie:
              schema:
                type: string
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/password/login:
    post:
      tags: [Auth]
      security: []
      summary: Sign in with an opt-in password
      description: Uses one generic unauthorized response for unknown accounts, disabled password credentials, and incorrect passwords.
      operationId: loginWithPassword
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordLoginRequest"
      responses:
        "200":
          description: Authenticated session established
          headers:
            Set-Cookie:
              description: Secure, HttpOnly, SameSite=Lax host-only session cookie scoped to /v1.
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/password/recovery:
    post:
      tags: [Auth]
      security: []
      summary: Request password setup or recovery
      description: Returns the same accepted projection for existing and unknown destinations. The side-channel token is single-use and subject to a security cooldown.
      operationId: requestPasswordRecovery
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRecoveryRequest"
      responses:
        "202":
          description: Recovery request accepted without disclosing account existence
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordRecoveryAcceptedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/password/recovery/confirm:
    post:
      tags: [Auth]
      security: []
      summary: Complete password setup or recovery
      description: Consumes the side-channel token once, replaces the password hash, revokes every session, and never signs the user in automatically.
      operationId: confirmPasswordRecovery
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRecoveryConfirmRequest"
      responses:
        "200":
          description: Password changed and existing sessions revoked
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordRecoveryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/session:
    get:
      tags: [Auth]
      summary: Get the current session
      description: Resolves the opaque host-only session cookie; never returns the bearer token or contact identifiers.
      operationId: getSession
      responses:
        "200":
          description: Current session
          headers:
            Cache-Control:
              description: Session responses are never stored by shared or browser caches.
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Auth]
      summary: Revoke the current session
      description: Idempotently revokes the presented session and expires the host-only cookie.
      operationId: logout
      responses:
        "204":
          description: Session revoked
          headers:
            Set-Cookie:
              description: Clears the Secure, HttpOnly, SameSite=Lax cookie scoped to /v1.
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
  /me:
    get:
      tags: [Auth]
      summary: Get the current user's profile
      description: Returns only the authenticated user's profile projection; contact identifiers and internal trust fields are excluded.
      operationId: getMyProfile
      responses:
        "200":
          description: Current profile
          headers:
            ETag:
              description: Strong profile version tag required by profile updates.
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Auth]
      summary: Update the current user's profile
      description: Updates a whitelisted profile projection using optimistic concurrency; contact and account-status fields cannot be changed here.
      operationId: updateMyProfile
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/UpdateMyProfileRequest"
      responses:
        "200":
          description: Updated profile
          headers:
            ETag:
              description: New strong profile version tag.
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfileResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /me/listings:
    get:
      tags: [Listings]
      summary: List listings managed by the current account
      description: |
        Returns a no-store account-center projection for personal Listings and Listings belonging
        to organizations where the current user is an active member. Management buckets are stable:
        DRAFT maps to editable drafts, PENDING to submitted review, PUBLISHED to public content, and
        ARCHIVED to archived, expired, or suspended content. The signed cursor is bound to the
        current actor, bucket, type, organization filter, and page size.
      operationId: listMyListings
      parameters:
        - name: bucket
          in: query
          schema:
            $ref: "#/components/schemas/OwnerListingBucket"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/ListingType"
        - name: organizationId
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Cursor-paginated private Listing management projection
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Pragma:
              schema: { type: string, const: no-cache }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyListingCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /me/listings/actions:
    post:
      tags: [Listings]
      summary: Apply a bounded action to managed listings
      description: |
        Applies ARCHIVE or DELETE to at most 20 unique Listings. Each item carries its own strong
        Listing version so one stale or foreign item cannot authorize another. Processing is
        intentionally non-atomic and returns one generic result per item; successful target-state
        retries do not append duplicate lifecycle evidence.
      operationId: batchManageMyListings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchListingActionRequest"
      responses:
        "200":
          description: Ordered per-item results
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Pragma:
              schema: { type: string, const: no-cache }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchListingActionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /me/sessions:
    get:
      tags: [Auth]
      summary: List the current user's active session devices
      description: Returns bounded session metadata without bearer tokens, token hashes, IP hashes, or contact identifiers.
      operationId: listMySessions
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Cursor-paginated active sessions
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDeviceCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Auth]
      summary: Revoke all of the current user's sessions
      description: Atomically revokes every active session for the authenticated user and expires the presented cookie.
      operationId: logoutAllSessions
      responses:
        "204":
          description: All sessions revoked
          headers:
            Set-Cookie:
              description: Clears the Secure, HttpOnly, SameSite=Lax cookie scoped to /v1.
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/sessions/{sessionId}:
    delete:
      tags: [Auth]
      summary: Revoke one of the current user's session devices
      description: Idempotently revokes only a session owned by the authenticated user; foreign and unknown identifiers share the same response.
      operationId: revokeMySession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: Session no longer active
          headers:
            Set-Cookie:
              description: Present only when the revoked session is the current session.
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /notifications:
    get:
      tags: [Notifications]
      summary: List the current user's in-app notifications
      description: Returns only rendered, private notification content owned by the authenticated user. Cursors are opaque and bound to the user and unread filter.
      operationId: listNotifications
      parameters:
        - name: unreadOnly
          in: query
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Cursor-paginated in-app notifications
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /notifications/{notificationId}/read:
    put:
      tags: [Notifications]
      summary: Mark an owned in-app notification as read
      description: Idempotently marks only the authenticated user's notification as read. Unknown and foreign identifiers share one 404 response.
      operationId: markNotificationRead
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "200":
          description: Notification is read
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /organizations:
    post:
      tags: [Organizations]
      summary: Create an organization owned by the current user
      description: Atomically creates the organization and its initial OWNER membership. The requested slug is the stable retry handle; an exact owner retry returns the original resource.
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organization and initial OWNER membership created, or the exact owner retry returned
          headers:
            Location:
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /organizations/{organizationId}:
    get:
      tags: [Organizations]
      summary: Get an organization visible to the current member
      description: Uses a membership-scoped repository query so unknown and cross-organization identifiers share one 404 response.
      operationId: getMyOrganization
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Member-safe organization projection
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /organizations/{organizationId}/members:
    get:
      tags: [Organizations]
      summary: List organization members for OWNER or ADMIN
      description: Returns only display identity, role, and join time; contact identifiers and account risk fields are excluded.
      operationId: listOrganizationMembers
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Cursor-paginated member projection
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMemberCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /organizations/{organizationId}/invitations:
    post:
      tags: [Organizations]
      summary: Invite an existing active user to a managed organization
      description: Creates one short-lived non-Owner invitation with actor-scoped exact idempotency and emits a durable in-app notification event.
      operationId: createOrganizationInvitation
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationInvitationRequest"
      responses:
        "201":
          description: Invitation created or exact retry returned
          headers:
            Location:
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationInvitationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /organizations/{organizationId}/invitations/{invitationId}:
    delete:
      tags: [Organizations]
      summary: Revoke a pending organization invitation
      description: OWNER or ADMIN may idempotently revoke a still-pending invitation without revealing cross-organization identifiers.
      operationId: revokeOrganizationInvitation
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/OrganizationInvitationId"
      responses:
        "204":
          description: Invitation revoked or already revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /organization-invitations/{invitationId}/accept:
    put:
      tags: [Organizations]
      summary: Accept the current user's organization invitation
      description: Atomically accepts one unexpired owned invitation and creates the membership; exact repeats return the accepted invitation.
      operationId: acceptOrganizationInvitation
      parameters:
        - $ref: "#/components/parameters/OrganizationInvitationId"
      responses:
        "200":
          description: Invitation accepted or exact accepted state returned
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationInvitationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
  /organizations/{organizationId}/members/{memberUserId}:
    patch:
      tags: [Organizations]
      summary: Change a non-Owner organization member role
      description: OWNER or ADMIN may change only non-Owner roles. Owner changes must use the recent-MFA transfer endpoint.
      operationId: changeOrganizationMemberRole
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/OrganizationMemberUserId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeOrganizationMemberRoleRequest"
      responses:
        "200":
          description: Member role updated
          headers:
            ETag:
              description: Strong membership version ETag.
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMemberResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Organizations]
      summary: Remove a non-Owner organization member
      description: OWNER or ADMIN may remove a non-Owner member. Self-removal and Owner removal fail closed.
      operationId: removeOrganizationMember
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/OrganizationMemberUserId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Non-Owner member removed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /organizations/{organizationId}/owner-transfer:
    post:
      tags: [Organizations]
      summary: Transfer Owner responsibility to another current member
      description: Requires a current OWNER, a recent MFA step-up, and an Idempotency-Key. The target is promoted before the actor is demoted so the organization always retains an Owner.
      operationId: transferOrganizationOwnership
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferOrganizationOwnershipRequest"
      responses:
        "200":
          description: Ownership transferred or exact transfer retry returned
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationOwnerTransferResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /regions:
    get:
      tags: [Taxonomy]
      security: []
      summary: List supported regions
      operationId: listRegions
      parameters:
        - name: parentCode
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/RegionType"
        - name: activeOnly
          in: query
          description: Public taxonomy is active-only; false is rejected.
          schema: { type: boolean, const: true, default: true }
        - name: q
          in: query
          description: Bounded name, code, slug, or normalized alias query
          schema: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "200":
          description: Region tree or children
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Region"
        "400":
          $ref: "#/components/responses/BadRequest"
  /categories:
    get:
      tags: [Taxonomy]
      security: []
      summary: List supported categories
      operationId: listCategories
      parameters:
        - name: vertical
          in: query
          schema:
            $ref: "#/components/schemas/ListingType"
        - name: parentId
          in: query
          schema: { type: string, format: uuid }
        - name: activeOnly
          in: query
          description: Public taxonomy is active-only; false is rejected.
          schema: { type: boolean, const: true, default: true }
        - name: q
          in: query
          description: Bounded bilingual name, slug, or normalized alias query
          schema: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "200":
          description: Category tree
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
  /categories/{categoryId}/form-schema:
    get:
      tags: [Taxonomy]
      security: []
      summary: Get a category form schema
      operationId: getCategoryFormSchema
      parameters:
        - $ref: "#/components/parameters/CategoryId"
        - name: version
          in: query
          description: Published historical version; omit for the category's current published version.
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Versioned dynamic form definition
          headers:
            ETag:
              description: Strong content hash for the immutable published version.
              schema: { type: string }
            Cache-Control:
              description: Public cache policy for an immutable or current schema response.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryFormSchema"
        "404":
          $ref: "#/components/responses/NotFound"
  /search:
    get:
      tags: [Search]
      security: []
      summary: Search public content
      operationId: searchContent
      parameters:
        - name: q
          in: query
          description: NFKC-normalized bilingual query text. Empty, control, and bidirectional-control input is rejected.
          schema: { type: string, minLength: 1, maxLength: 120 }
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/ListingType"
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: regionCode
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 80
            pattern: "^[A-Za-z0-9._:-]+$"
        - name: latitude
          in: query
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: longitude
          in: query
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: radiusMiles
          in: query
          description: Requires latitude and longitude.
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: minPrice
          in: query
          schema:
            type: string
            pattern: "^(?:0|[1-9][0-9]{0,11})(?:\\.[0-9]{1,2})?$"
        - name: maxPrice
          in: query
          schema:
            type: string
            pattern: "^(?:0|[1-9][0-9]{0,11})(?:\\.[0-9]{1,2})?$"
        - name: sort
          in: query
          schema:
            type: string
            enum: [RELEVANCE, NEWEST, PRICE_ASC, PRICE_DESC, DISTANCE]
            default: RELEVANCE
        - name: cursor
          in: query
          description: Signed opaque point-in-time cursor bound to every filter, sort, and limit.
          schema: { type: string, maxLength: 2048 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Search results and facets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "410":
          $ref: "#/components/responses/Gone"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /search/suggestions:
    get:
      tags: [Search]
      security: []
      summary: Get search suggestions
      description: >
        Returns operational dictionary, active taxonomy, and privacy-thresholded
        query suggestions. Omit q to receive safe category and region defaults.
      operationId: getSearchSuggestions
      parameters:
        - name: q
          in: query
          schema: { type: string, minLength: 1, maxLength: 50 }
        - name: regionCode
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 80
            pattern: "^[A-Za-z0-9._:-]+$"
        - name: locale
          in: query
          schema:
            type: string
            enum: [zh-Hans, en-US]
            default: zh-Hans
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 10, default: 10 }
      responses:
        "200":
          description: Safe query, category, and region suggestions
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchSuggestionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /search/trending:
    get:
      tags: [Search]
      security: []
      summary: Get privacy-safe trending searches
      description: >
        Returns only bot-filtered, result-bearing searches that satisfy the
        minimum anonymity threshold. Raw query counts are never exposed.
      operationId: getTrendingSearches
      parameters:
        - name: regionCode
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 80
            pattern: "^[A-Za-z0-9._:-]+$"
        - name: locale
          in: query
          schema:
            type: string
            enum: [zh-Hans, en-US]
            default: zh-Hans
        - name: window
          in: query
          schema:
            type: string
            enum: [DAY_1, DAY_7, DAY_30]
            default: DAY_7
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 10, default: 10 }
      responses:
        "200":
          description: Privacy-thresholded trending searches
          headers:
            Cache-Control:
              schema: { type: string, const: "public, max-age=300" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchTrendingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /homepage:
    get:
      tags: [Homepage]
      security: []
      summary: Get the modular public homepage
      description: >
        Composes the current published layout with canonical public projections.
        Modules with no real data are omitted, and one module dependency failure
        does not fail otherwise available modules.
      operationId: getHomepage
      parameters:
        - name: locale
          in: query
          schema:
            type: string
            enum: [zh-Hans, en-US]
            default: zh-Hans
        - name: regionCode
          in: query
          description: Published homepage layout scope and public data region.
          schema:
            type: string
            minLength: 2
            maxLength: 80
            pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
            default: US-CA-SOCAL
        - name: device
          in: query
          schema:
            $ref: "#/components/schemas/HomepageDevice"
      responses:
        "200":
          description: Available real-data homepage modules in published layout order
          headers:
            Cache-Control:
              description: Shared caching remains disabled until PERF-001 validates production budgets.
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomepageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /listings:
    get:
      tags: [Listings]
      security: []
      summary: List visible listings
      operationId: listListings
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [RENTAL, JOB, TRANSFER, SECONDHAND, SERVICE]
            default: RENTAL
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: regionCode
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Stable cursor-paginated public listing summaries
          headers:
            Cache-Control:
              schema: { type: string, const: "public, max-age=30" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Listings]
      summary: Create a draft listing
      operationId: createListing
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListingRequest"
      responses:
        "201":
          description: Draft listing created
          headers:
            ETag:
              description: Strong Listing version ETag.
              schema: { type: string, pattern: '^"listing-v[1-9]\d{0,9}"$' }
            Location:
              description: Canonical API path for the created draft.
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingOwnerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /listings/{listingId}:
    get:
      tags: [Listings]
      security:
        - {}
        - sessionCookie: []
      summary: Get a visible listing
      operationId: getListing
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "200":
          description: Public detail, or the safe owner view for an authorized draft reader
          headers:
            ETag:
              description: Strong Listing version ETag.
              schema: { type: string, pattern: '^"listing-v[1-9]\d{0,9}"$' }
            Cache-Control:
              schema: { type: string, enum: [no-store, "public, max-age=60"] }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Listings]
      summary: Update an owned listing
      description: |
        Updates a draft or a currently published Listing with strong optimistic concurrency.
        Published edits require Idempotency-Key. A low-risk minor text edit remains public;
        material category, region, price, contact, location, media, structured-field or risky-text
        changes enter review and disappear from public reads until a moderator decides them.
      operationId: updateListing
      parameters:
        - $ref: "#/components/parameters/ListingId"
        - $ref: "#/components/parameters/IfMatch"
        - name: Idempotency-Key
          in: header
          required: false
          description: Required for published edits; actor-scoped exact retries return the original revision.
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/UpdateListingRequest"
      responses:
        "200":
          description: Updated listing
          headers:
            ETag:
              description: Strong Listing version ETag.
              schema: { type: string, pattern: '^"listing-v[1-9]\d{0,9}"$' }
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingOwnerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      tags: [Listings]
      summary: Soft-delete an owned listing
      operationId: deleteListing
      parameters:
        - $ref: "#/components/parameters/ListingId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Listing soft-deleted and removed from search
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /listings/{listingId}/revisions:
    get:
      tags: [Listings]
      summary: List immutable revision evidence for an owned listing
      description: |
        Returns a no-store owner/organization-writer projection with stable review reasons and a
        redacted before/after diff. Immutable normalized snapshots and hashes remain server-side.
      operationId: listListingRevisions
      parameters:
        - $ref: "#/components/parameters/ListingId"
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Stable newest-first Listing revision history
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingRevisionCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /listings/{listingId}/submit:
    post:
      tags: [Listings]
      summary: Submit a listing for moderation
      operationId: submitListing
      parameters:
        - $ref: "#/components/parameters/ListingId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "202":
          description: Listing entered automated/manual review workflow
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
